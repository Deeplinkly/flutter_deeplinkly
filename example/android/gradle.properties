org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# com.deeplinkly:deeplinkly-android is on Maven Central, so the example resolves
# it the same way a consumer does — leave this off. Flip it to true only to build
# against an unreleased SDK:
#
#     cd ../../android_deeplinkly && ./gradlew publishToMavenLocal -PsigningEnabled=false
#
# Only affects this example app, never a consumer's.
deeplinkly.useMavenLocal=false
