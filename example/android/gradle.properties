org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Lets this example app build against a locally published native SDK:
#
#     cd ../../android_deeplinkly && ./gradlew publishToMavenLocal
#
# Only affects this example app, never a consumer's. mavenLocal is consulted
# last, so once com.deeplinkly:deeplinkly-android is on Maven Central that copy
# wins and this line becomes a no-op.
deeplinkly.useMavenLocal=true
