group = "com.deeplinkly.flutter_deeplinkly"

// Read from pubspec rather than written here. This value is cosmetic for a
// pub-published plugin — nothing resolves the AAR by coordinate — but a
// hand-maintained second copy of the version is a copy that goes stale, and
// "1.0-SNAPSHOT" in the build scan of a 1.9.0 release is exactly that stale
// copy being read by someone trying to work out which build they have.
version = file("../pubspec.yaml").readLines()
    .find { it.startsWith("version:") }
    ?.replaceFirst(/^version:\s*/, "")
    ?.trim() ?: "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Opt-in seam for developing this bridge against an unreleased native
        // SDK: run `./gradlew publishToMavenLocal` in android_deeplinkly, then
        // build with -Pdeeplinkly.useMavenLocal=true. Off by default, because a
        // machine-local artifact silently shadowing a real one is exactly the
        // kind of irreproducible build nobody wants to debug.
        if (project.findProperty("deeplinkly.useMavenLocal") == "true") {
            mavenLocal()
        }
    }
}

apply plugin: "com.android.library"

// Kotlin is applied conditionally rather than declared, because Flutter is
// removing the plugin's right to bring its own. From AGP 9 the Kotlin support
// is built into AGP itself, and a plugin that applies KGP will fail its host
// app's build; before AGP 9 nothing applies it for us on older Flutter, so the
// plugin must still apply it itself or this module does not compile.
//
// The apply goes through pluginManager rather than `apply plugin:` on purpose.
// Flutter greps plugin build files for that literal syntax to warn host apps
// about un-migrated plugins, and a conditional apply is not what that warning
// is for — it fires on the text, not on the behaviour.
//
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9 && !pluginManager.hasPlugin("org.jetbrains.kotlin.android")) {
    pluginManager.apply("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.deeplinkly.flutter_deeplinkly"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    testOptions {
        // Robolectric resolves resources/SharedPreferences for the tests that
        // need a real Context via ApplicationProvider.
        unitTests.includeAndroidResources = true

        unitTests.all {
            // The suite is JUnit 4 (org.junit.Test / org.junit.Assert), so the
            // JUnit Platform runner would collect nothing.
            useJUnit()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// The replacement for `android.kotlinOptions`, which is going away with the
// KGP that owned it. Left unset, Kotlin compiles to its own default target
// while Java compiles to 11 above, and AGP fails the build over the mismatch.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // The SDK itself. Everything below the method channel — deep link
    // resolution, the install referrer, attribution, the queues, retries,
    // device signals, networking — lives here and is shared with the native
    // Android SDK, so the two can never drift.
    //
    // `api`, not `implementation`: a host app that wants to call Deeplinkly
    // directly (to log an event from native code alongside Flutter, say) can,
    // without re-declaring the dependency.
    //
    // Its own dependencies arrive transitively and are deliberately NOT
    // repeated here — installreferrer, play-services-appset, coroutines and
    // core-ktx, plus the compileOnly treatment of play-services-ads-identifier
    // that keeps the AD_ID permission out of host manifests. Redeclaring any
    // of them is how the two builds start to disagree.
    api 'com.deeplinkly:deeplinkly-android:1.1.1'

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.17.0")
    testImplementation("junit:junit:4.13.2")
    testImplementation("androidx.test:core:1.6.1")
    testImplementation("org.robolectric:robolectric:4.14.1")


    // Flutter embedding dependencies
    // Flutter automatically provides these when building through 'flutter run'
    // For direct builds, we try to find the Flutter JAR
    def flutterJar = "$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar"
    if (file(flutterJar).exists()) {
        compileOnly files(flutterJar)
        testCompileOnly files(flutterJar)
        testRuntimeOnly files(flutterJar)
    } else {
        // Try alternative location
        def altFlutterJar = "$flutterRoot/bin/cache/artifacts/engine/android/flutter.jar"
        if (file(altFlutterJar).exists()) {
            compileOnly files(altFlutterJar)
        }
    }
}
