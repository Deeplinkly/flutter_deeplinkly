name: Publish

# Tag-triggered: push vX.Y.Z to release X.Y.Z to pub.dev.
#
# Authenticates via pub.dev's automated (OIDC) publishing — no token is
# stored in this repo. That has to be configured once on pub.dev's side; see
# the "Automated publishing" section in docs/NATIVE_SDK_MIGRATION.md's
# sibling doc, NEXT.md, for the exact settings this workflow expects.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${VERSION}"
            exit 1
          fi
          echo "releasing ${VERSION}"

  # Never publish on a path the ordinary PR/push CI didn't also run.
  ci:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  # pub.dev's OIDC token is provisioned by the dart-lang/setup-dart action
  # itself during setup, not negotiated by `dart pub publish` at call time -
  # confirmed by reading dart-lang/setup-dart's own publish.yml. A hand-rolled
  # job that skips that action (as this one used to) never gets a credential
  # provisioned, so `dart pub publish --force` falls back to interactive
  # Google login regardless of id-token permissions - which just hangs
  # forever on a runner with no browser. Use the official reusable workflow
  # rather than re-implement its exact setup-action ordering by hand.
  publish:
    needs: ci
    permissions:
      id-token: write # required for pub.dev's OIDC token exchange
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
